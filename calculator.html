<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VA Disability Calculator 2026 | DAX Reciprocated</title>
<style>
:root{
    --primary:#7a0f14;
    --primary-dark:#540b0f;
    --secondary:#202531;
    --accent:#f6f1eb;
    --surface:#ffffff;
    --surface-2:#f8f6f2;
    --text:#1f2430;
    --muted:#5f6777;
    --success:#2f6f3e;
    --border:#ddd6cc;
    --bilateral:#1d5fd0;
    --shadow:0 12px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#f4f1eb 0%,#ece7df 100%);
    color:var(--text);
    line-height:1.5;
    padding:20px;
}
.wrap{
    max-width:760px;
    margin:0 auto;
}
.card{
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:24px;
    border:1px solid rgba(0,0,0,.05);
}
h1{
    margin:0 0 6px;
    text-align:center;
    color:var(--primary);
    font-size:clamp(1.9rem,3vw,2.4rem);
    line-height:1.1;
}
.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:.98rem;
    margin-bottom:24px;
}
.notice{
    background:var(--accent);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:20px;
    color:#473d34;
    font-size:.92rem;
}
.section-title{
    font-weight:800;
    color:var(--secondary);
    margin:18px 0 10px;
    display:block;
    text-transform:uppercase;
    font-size:.8rem;
    letter-spacing:1.2px;
}
.body-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}
.percent-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-bottom:20px;
}
.btn-body,.btn-percent,.btn-small{
    appearance:none;
    border:2px solid #e5e1db;
    background:#fff;
    color:#4f5563;
    border-radius:10px;
    cursor:pointer;
    transition:.2s ease;
    font-weight:700;
}
.btn-body{
    padding:14px;
    font-size:1rem;
}
.btn-percent{
    padding:12px 0;
    font-size:.95rem;
}
.btn-small{
    padding:10px 14px;
    font-size:.92rem;
}
.btn-body:hover,.btn-percent:hover,.btn-small:hover{
    border-color:var(--primary);
    transform:translateY(-1px);
}
.selected{
    background:var(--primary)!important;
    color:#fff!important;
    border-color:var(--primary-dark)!important;
}
.full-width{grid-column:span 2}
.action-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin:10px 0 20px;
}
.btn-add{
    width:100%;
    background:var(--success);
    color:#fff;
    border:none;
    padding:16px;
    font-size:1.06rem;
    border-radius:10px;
    cursor:pointer;
    font-weight:800;
    opacity:.45;
    pointer-events:none;
    transition:.2s ease;
}
.btn-add.active{
    opacity:1;
    pointer-events:auto;
}
.result-box{
    background:linear-gradient(135deg,var(--secondary) 0%, #11151d 100%);
    color:#fff;
    border-radius:16px;
    padding:24px;
    text-align:center;
    margin-bottom:18px;
}
.result-label{
    font-size:.9rem;
    text-transform:uppercase;
    letter-spacing:1px;
    opacity:.8;
}
.big-rate{
    font-size:3.6rem;
    font-weight:900;
    line-height:1;
    margin:10px 0;
}
.sub-rate{
    font-size:1.02rem;
    color:#f3d56b;
    font-weight:700;
    margin-bottom:6px;
}
.pay-rate{
    font-size:1.02rem;
}
.helper{
    margin-top:10px;
    font-size:.84rem;
    color:#d7dbe2;
}
.bilateral-box,.math-box{
    background:#eef4ff;
    border-left:5px solid var(--bilateral);
    padding:15px;
    margin-bottom:16px;
    border-radius:8px;
    display:none;
}
.bilateral-title{
    color:var(--bilateral);
    font-weight:800;
    margin-bottom:8px;
}
.math-step{
    font-size:.92rem;
    margin-bottom:5px;
    color:#344054;
}
.list-container{
    background:var(--surface-2);
    border-radius:12px;
    border:1px solid #ece6dc;
    margin-bottom:20px;
    overflow:hidden;
    display:none;
}
.list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 15px;
    border-bottom:1px solid #e8e1d5;
    font-size:.95rem;
}
.list-item:last-child{border-bottom:none}
.delete-btn{
    color:#b42318;
    cursor:pointer;
    font-weight:800;
    padding-left:10px;
}
.settings{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    padding-top:14px;
    border-top:1px solid #ece6dc;
    margin-bottom:18px;
}
label{
    display:block;
    font-size:.88rem;
    margin-bottom:6px;
    color:var(--muted);
    font-weight:700;
}
select,input{
    width:100%;
    padding:11px 12px;
    border:1px solid #d3d7de;
    border-radius:8px;
    font-size:.95rem;
    background:#fff;
}
.disclaimer{
    font-size:.76rem;
    color:#6b7280;
    margin-top:20px;
    line-height:1.5;
    border-top:1px solid #e9e3d8;
    padding-top:14px;
}
