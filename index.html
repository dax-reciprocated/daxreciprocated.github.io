<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAX Reciprocated | VA Disability Education & Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0b1220;
    --bg-soft: #111a2b;
    --panel: rgba(255,255,255,0.08);
    --panel-solid: #ffffff;
    --text: #f8fafc;
    --muted: #cbd5e1;
    --dark-text: #172033;
    --primary: #d64045;
    --primary-hover: #bb2f35;
    --accent: #d4af37;
    --line: rgba(255,255,255,0.12);
    --shadow: 0 20px 50px rgba(0,0,0,0.25);
    --radius: 18px;
    --max: 1180px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    color: var(--text);
    font-family: "Inter", Arial, sans-serif;
    line-height: 1.6;
    background:
        linear-gradient(rgba(7, 12, 20, 0.88), rgba(7, 12, 20, 0.92)),
        url('IMG_1109.png') center/cover no-repeat fixed;
}

img {
    max-width: 100%;
    display: block;
}

a {
    color: inherit;
}

.container {
    width: min(92%, var(--max));
    margin: 0 auto;
}

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    backdrop-filter: blur(10px);
    background: rgba(8, 14, 24, 0.82);
    border-bottom: 1px solid var(--line);
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 16px 0;
}

.brand {
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.95rem;
}

nav {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
}

nav a {
    text-decoration: none;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.95rem;
}

nav a:hover {
    color: #fff;
}

.hero {
    padding: 90px 0 70px;
}

.hero-grid {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 32px;
    align-items: center;
}

.eyebrow {
    display: inline-block;
    margin-bottom: 18px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(212, 175, 55, 0.14);
    color: #f7dc85;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
}

.hero h1 {
    margin: 0 0 18px;
    font-family: "Libre Baskerville", serif;
    font-size: clamp(2.5rem, 5vw, 4.6rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
}

.hero p {
    max-width: 700px;
    color: var(--muted);
    font-size: 1.08rem;
    margin-bottom: 18px;
}

.hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 28px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 14px 22px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    transition: 0.2s ease;
}

.btn-primary {
    background: var(--primary);
    color: white;
    box-shadow: var(--shadow);
}

.btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
}

.btn-secondary {
    background: transparent;
    color: #fff;
    border: 1px solid var(--line);
}

.btn-secondary:hover {
    background: rgba(255,255,255,0.06);
}

.hero-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
}

.hero-card h3 {
    margin-top: 0;
    margin-bottom: 16px;
    font-size: 1.1rem;
}

.hero-card ul {
    padding-left: 18px;
    color: var(--muted);
    margin: 0 0 20px;
}

.hero-card li {
    margin-bottom: 10px;
}

.hero-note {
    font-size: 0.95rem;
    color: #f1f5f9;
    padding-top: 14px;
    border-top: 1px solid var(--line);
}

section {
    padding: 70px 0;
}

.section-shell {
    background: rgba(9, 15, 26, 0.7);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 44px;
    box-shadow: var(--shadow);
}

.section-heading {
    max-width: 760px;
    margin-bottom: 26px;
}

.section-heading h2 {
    margin: 0 0 12px;
    font-family: "Libre Baskerville", serif;
    font-size: clamp(1.9rem, 3vw, 3rem);
    line-height: 1.15;
}

.section-heading p {
    margin: 0;
    color: var(--muted);
}

.value-grid,
.service-grid,
.proof-grid {
    display: grid;
    gap: 22px;
}

.value-grid {
    grid-template-columns: repeat(3, 1fr);
}

.service-grid {
    grid-template-columns: repeat(2, 1fr);
}

.proof-grid {
    grid-template-columns: 1.1fr 0.9fr;
    align-items: start;
}

.card {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px;
}

.card h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 1.15rem;
}

.card p, .card li {
    color: var(--muted);
}

.card ul {
    padding-left: 18px;
    margin-bottom: 0;
}

.service-card {
    background: #fff;
    color: var(--dark-text);
    border-radius: 20px;
    padding: 30px;
    box-shadow: var(--shadow);
}

.service-card h3 {
    margin-top: 0;
    margin-bottom: 10px;
    color: #0f172a;
    font-size: 1.25rem;
}

.service-label {
    font-size: 0.9rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #7c2d12;
    margin-bottom: 14px;
}

.service-subtitle {
    font-size: 1rem;
    color: #334155;
    font-weight: 700;
    margin-bottom: 18px;
}

.service-card ul {
    padding-left: 18px;
    margin-bottom: 18px;
}

.service-card li {
    margin-bottom: 10px;
    color: #334155;
}

.service-card p {
    color: #334155;
}

.service-card.featured {
    border: 2px solid rgba(214, 64, 69, 0.28);
    position: relative;
}

.service-card.featured::before {
    content: "Most Veterans Start Here";
    position: absolute;
    top: -14px;
    left: 24px;
    background: var(--primary);
    color: white;
    font-size: 0.76rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 8px 12px;
    border-radius: 999px;
}

.quote {
    font-size: 1.08rem;
    color: #1e293b;
    line-height: 1.7;
    margin-bottom: 12px;
}

.quote-source {
    color: #475569;
    font-weight: 700;
}

.resource-list {
    display: grid;
    gap: 14px;
}

.resource-link {
    display: block;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    text-decoration: none;
    font-weight: 600;
}

.resource-link:hover {
    background: rgba(255,255,255,0.10);
}

.contact-panel {
    text-align: center;
}

.contact-panel p {
    max-width: 720px;
    margin: 0 auto 18px;
    color: var(--muted);
}

.contact-email {
    font-weight: 800;
    color: #fff;
}

.disclaimer {
    margin-top: 28px;
    font-size: 0.92rem;
    color: #cbd5e1;
    opacity: 0.92;
}

footer {
    padding: 26px 0 40px;
    color: #cbd5e1;
}

footer .footer-box {
    border-top: 1px solid var(--line);
    padding-top: 24px;
    font-size: 0.92rem;
}

@media (max-width: 980px) {
    .hero-grid,
    .proof-grid,
    .value-grid,
    .service-grid {
        grid-template-columns: 1fr;
    }

    .header-inner {
        flex-direction: column;
        align-items: flex-start;
    }

    nav {
        gap: 14px;
    }
}

@media (max-width: 640px) {
    .hero {
        padding: 70px 0 50px;
    }

    .section-shell {
        padding: 26px;
        border-radius: 18px;
    }

    .hero-card,
    .service-card,
    .card {
        padding: 22px;
    }

    .btn {
        width: 100%;
    }
